name: Lembretes de ponto

# Chama a API a cada 5 minutos para enviar os lembretes push de entrada e saída.
# Cada lembrete sai uma vez por dia; chamadas repetidas ou atrasadas não duplicam.
# Configure em Settings → Secrets and variables → Actions:
#   APP_URL     = endereço do app, ex. https://ponto.suaempresa.com.br
#   CRON_SECRET = o mesmo valor da variável CRON_SECRET da API (na Vercel)
# Sem os dois, o workflow não faz nada.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Disparar lembretes
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL ou CRON_SECRET não configurados: nada a fazer."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "${APP_URL%/}/api/push/tick" \
            -H "Authorization: Bearer $CRON_SECRET"
