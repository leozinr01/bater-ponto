name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (tipos, unitários e e2e)
    runs-on: ubuntu-latest
    services:
      # Banco descartável: os e2e criam um schema próprio por arquivo e aplicam as migrations reais
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ponto
          POSTGRES_USER: ponto
          POSTGRES_PASSWORD: ponto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ponto -d ponto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ponto:ponto@localhost:5432/ponto?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  web:
    name: App (tipos e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
