services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema-de-ponto-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ponto
      POSTGRES_USER: ponto
      POSTGRES_PASSWORD: ponto
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ponto -d ponto']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
